<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENBM Control</title><link rel="stylesheet" href="/styles.css"></head><body><main><h1>RENBM Control</h1><p class="warning">Meta mutations mặc định TẮT. Provider-derived và dữ liệu nội bộ được hiển thị riêng.</p><section><h2>Phiên staff</h2><input id="key" type="password" placeholder="Staff API key"><select id="role"><option>admin</option><option>staff</option></select><input id="staff" placeholder="Staff ID"></section><section><h2>BM inventory</h2><button id="refresh">Làm mới</button><div id="inventory"></div></section><section><h2>Tạo BM theo lô</h2><input id="qty" type="number" min="1" max="100" value="1"><input id="rate" type="number" min="1" value="1"><input id="template" value="BM-{n}"><button id="enqueue">Xếp hàng</button><div id="jobs"></div></section><section><h2>Mời quản trị viên</h2><input id="inviteBm" placeholder="BM ID"><input id="email" type="email" placeholder="email@example.com"><select id="inviteRole"><option>admin</option><option>employee</option></select><button id="invite">Xếp hàng mời</button></section><section><h2>Chia sẻ đối tác</h2><input id="sourceBm" placeholder="Source BM ID"><input id="partner" placeholder="Partner Business ID"><input id="accounts" placeholder="Ad account IDs, cách nhau dấu phẩy"><input id="randomCount" type="number" min="1" placeholder="hoặc random count"><button id="preview">Preview</button><pre id="sharePreview"></pre><button id="confirm" disabled>Confirm & enqueue</button></section><section><h2>Nhật ký thao tác</h2><pre id="log"></pre></section></main><script src="/app.js"></script></body></html>
